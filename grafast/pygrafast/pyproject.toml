[project]
name = "pygrafast"
version = "0.1.0"
description = "Python port of grafast - a planning-based GraphQL execution engine"
requires-python = ">=3.11"
dependencies = [
    "graphql-core>=3.2,<4",
    "json5>=0.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygrafast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
